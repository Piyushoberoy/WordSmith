<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - WordSmith</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        body {
            background: linear-gradient(to right, #8360c3, #2ebf91);
            font-family: 'Poppins', sans-serif;
        }
        .register-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }
        .form-control:focus {
            border-color: #2ebf91;
            box-shadow: 0px 0px 8px rgba(46, 191, 145, 0.5);
        }
        .btn-register {
            background: #2ebf91;
            color: white;
            transition: 0.3s;
        }
        .btn-register:hover {
            background: #1b9a77;
        }
        .error-msg {
            color: red;
            font-size: 14px;
        }
    </style>

</head>
<body>

    <div class="container">
        <div class="register-container">
            <h3 class="text-center">Create an Account</h3>
            <p class="text-center text-muted">Join WordSmith today</p>
            
            <!-- Display Django messages -->
            {% if messages %}
            <div class="alert alert-danger">
                {% for message in messages %}
                    {{ message }}
                {% endfor %}
            </div>
            {% endif %}

            <form id="registerForm" method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                    <span class="error-msg" id="usernameError"></span>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                    <span class="error-msg" id="emailError"></span>
                </div>

                <div class="mb-3">
                    <label for="password1" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password1" name="password1" required>
                    <span class="error-msg" id="passwordError"></span>
                </div>

                <div class="mb-3">
                    <label for="password2" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="password2" name="password2" required>
                    <span class="error-msg" id="confirmPasswordError"></span>
                </div>

                <button type="submit" class="btn btn-register w-100">Register</button>
            </form>

            <p class="text-center mt-3">
                Already have an account? <a href="{% url 'login' %}">Login</a>
            </p>
        </div>
    </div>

    <!-- jQuery & Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS for Real-time Validation -->
    <script>
        $(document).ready(function() {
            function validateEmail(email) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            }

            function validatePassword(password) {
                return password.length >= 6 && /[A-Za-z]/.test(password) && /\d/.test(password);
            }

            $("#username").on("input", function() {
                let username = $(this).val();
                if (username.length < 3) {
                    $("#usernameError").text("Username must be at least 3 characters.");
                } else {
                    $("#usernameError").text("");
                }
            });

            $("#email").on("input", function() {
                let email = $(this).val();
                if (!validateEmail(email)) {
                    $("#emailError").text("Invalid email format.");
                } else {
                    $("#emailError").text("");
                }
            });

            $("#password1").on("input", function() {
                let password = $(this).val();
                if (!validatePassword(password)) {
                    $("#passwordError").text("Password must be at least 6 characters, contain letters and numbers.");
                } else {
                    $("#passwordError").text("");
                }
            });

            $("#password2").on("input", function() {
                let password1 = $("#password1").val();
                let password2 = $(this).val();
                if (password1 !== password2) {
                    $("#confirmPasswordError").text("Passwords do not match.");
                } else {
                    $("#confirmPasswordError").text("");
                }
            });

            $("#registerForm").submit(function(event) {
                let username = $("#username").val();
                let email = $("#email").val();
                let password1 = $("#password1").val();
                let password2 = $("#password2").val();

                if (username.length < 3 || !validateEmail(email) || !validatePassword(password1) || password1 !== password2) {
                    event.preventDefault();
                    alert("Please fix the errors before submitting.");
                }
            });
        });
    </script>

</body>
</html>
