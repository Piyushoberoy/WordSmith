<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizzes | WordSmith</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Custom Styles -->
    <style>
        body {
            background: linear-gradient(135deg, #2ebf91, #136a8a);
            color: white;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .quiz-container {
            max-width: 900px;
            margin: auto;
            padding: 40px;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        .quiz-card {
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            transition: all 0.4s ease-in-out;
            cursor: pointer;
            transform: perspective(1000px);
            transform-style: preserve-3d;
        }

        .quiz-card:hover {
            transform: scale(1.05) rotateY(10deg);
            box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.3);
        }

        .quiz-card p {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }

        .btn-custom {
            background: white;
            color: #2ebf91;
            font-weight: bold;
            border-radius: 25px;
            padding: 10px 20px;
            transition: all 0.3s;
        }

        .btn-custom:hover {
            background: #1b9a77;
            color: white;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 24px;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        .footer {
            margin-top: auto;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 0;
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div class="loading">Loading Quizzes...</div>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">WordSmith</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'register' %}">Register</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'add_word' %}">Add Word</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'quiz_list' %}">Take a Quiz</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Quiz Section -->
    <div class="quiz-container hidden">
        <h2 class="text-center">📝 Available Quizzes</h2>
        <div class="row mt-4">
            {% for quiz in quizzes %}
                <div class="col-md-6 mb-4">
                    <div class="quiz-card p-4" data-bs-toggle="tooltip" title="Click to start quiz!">
                        <p>{{ quiz.question }}</p>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2025 WordSmith. All rights reserved.</p>
    </footer>

    <!-- Bootstrap & JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery Enhancements -->
    <script>
        $(document).ready(function () {
            // Show quizzes after a short delay
            setTimeout(function () {
                $(".loading").fadeOut();
                $(".quiz-container").removeClass("hidden").fadeIn();
            }, 1000);

            // Enable Bootstrap tooltips
            $('[data-bs-toggle="tooltip"]').tooltip();

            // Quiz card click effect
            $(".quiz-card").click(function () {
                alert("Quiz Started!");
            });
        });
    </script>

</body>
</html>
